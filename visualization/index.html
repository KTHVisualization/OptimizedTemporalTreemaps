<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v3.min.js"></script>
    <script src="lib/colors/colorSchemes.js"></script>
    <script src="lib/dataset.js"></script>

    <!-- Load visualization libraries in dependency order -->
    <script src="ext/bezier.js"></script>

    <!--  ADD COLOR CLASSES HERE: -->
    <script src="lib/colors/colorsD3.js"></script>
    <script src="lib/colors/colorPop.js"></script>
    <script src="lib/colors/colorCode.js"></script>

    <!-- Then load other data structures -->
    <script src="lib/datastructures.js"></script>
    <script src="lib/utils.js"></script>
    <script src="lib/curves.js"></script>

    <!-- Finally load the main library -->
    <script src="lib/temporalTreemapLib.js"></script>

    <script type="module" src="lib/bridges/loadDataset.js"></script>
    <script type="module" src="lib/panel.js" defer></script>
    <script
      type="module"
      src="lib/bridges/UIMapper.js"
      defer
    ></script>
  </head>
  <body>
    <div class="main-container">
      <div class="main-area">
        <!-- Add main vizualization here -->
        <div id="container1" class="container"></div>
        <div id="container2" class="container-bot" style="display: none;"></div>
      </div>
      <div class="right-sidebar">
        <!-- Add sidebar things here -->
        
        <button id="sidebarToggleBtn" class="sidebar-toggle-btn" title="Toggle Sidebar">
          <span class="triangle-icon">▶</span>
        </button>


        <div class="toggle-view-btns">
          <button id="singleViewBtn" class="active">Single View</button>
          <button id="compareViewBtn">Compare View</button>
        </div>
        <div class="dataset-dropdown-section" id="dataset1-selection">
          <label for="dataset">Dataset</label>
          <div class="custom-select-wrapper">
            <select id="dataset">
              <!-- Options will be populated dynamically from datasets.js -->
            </select>
          </div>
        </div>

        <div class="dataset-dropdown-section" id="dataset2-selection" style="display: none;">
          <label for="dataset2">Compare Dataset</label>
          <div class="custom-select-wrapper">
            <select id="dataset2">
              <!-- Options will be populated dynamically from datasets.js -->
            </select>
          </div>
        </div>

        <ul id="variousList" class="various-list"></ul>
      </div>
    </div>
  </body>
</html>
